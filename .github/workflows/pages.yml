- name: Install dependencies
  run: npm install

- name: Check Supabase environment
  run: |
    if [ -z "$VITE_SUPABASE_URL" ]; then
      echo "ERROR: VITE_SUPABASE_URL is empty"
      exit 1
    fi

    if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
      echo "ERROR: VITE_SUPABASE_ANON_KEY is empty"
      exit 1
    fi

    echo "Supabase environment variables are available."
  env:
    VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
    VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

- name: Build
  run: npm run build
  env:
    VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
    VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
